<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 630" width="1000" height="630" role="img" aria-labelledby="t d">
  <title id="t">Sankofa architecture</title>
  <desc id="d">Browser inputs (location, current crop, priorities, rainfall scenario, language selector) call four FastAPI endpoints. The backend uses NASA POWER, MODIS NDVI, scoring, Gemini narration and Khaya AI translation to produce ranked rotation cards, an onset banner and an NDVI bar chart.</desc>

  <defs>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#E6912A" />
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#6e7681" />
    </marker>
  </defs>

  <rect width="1000" height="630" rx="10" fill="#0d1117" />
  <rect x="0.5" y="0.5" width="999" height="629" rx="10" fill="none" stroke="#30363d" />

  <!-- ============ Frontend row ============ -->
  <text x="24" y="24" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e6edf3">
    Browser — React + Vite + Recharts
  </text>

  <g font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
    <!-- 1. Location -->
    <rect x="24" y="36" width="180" height="58" rx="6" fill="#161b22" stroke="#30363d" />
    <g stroke="#8b949e" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="46" cy="60.5" r="4.2" />
      <path d="M43.4 64.4 L46 71 L48.6 64.4" />
    </g>
    <text x="64" y="60" font-size="11.5" font-weight="600" fill="#e6edf3">Location</text>
    <text x="64" y="76" font-size="9.5" fill="#8b949e">GPS · Nominatim</text>

    <!-- 2. Current crop -->
    <rect x="216" y="36" width="180" height="58" rx="6" fill="#161b22" stroke="#30363d" />
    <g stroke="#8b949e" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M238 71 V57" />
      <path d="M238 63 C232 63 230 58 231 54 C236 54 238 58 238 63 Z" />
      <path d="M238 66 C244 66 246 61 245 57 C240 57 238 61 238 66 Z" />
    </g>
    <text x="256" y="60" font-size="11.5" font-weight="600" fill="#e6edf3">Current crop</text>
    <text x="256" y="76" font-size="9.5" fill="#8b949e">maize, cowpea…</text>

    <!-- 3. Priorities -->
    <rect x="408" y="36" width="180" height="58" rx="6" fill="#161b22" stroke="#30363d" />
    <g stroke="#8b949e" stroke-width="1.6" fill="none" stroke-linecap="round">
      <path d="M423 55 H439" /><path d="M423 65 H439" /><path d="M423 75 H439" />
      <circle cx="431" cy="55" r="2.1" fill="#0d1117" />
      <circle cx="436" cy="65" r="2.1" fill="#0d1117" />
      <circle cx="428" cy="75" r="2.1" fill="#0d1117" />
    </g>
    <text x="448" y="60" font-size="11.5" font-weight="600" fill="#e6edf3">Priorities</text>
    <text x="448" y="76" font-size="9.5" fill="#8b949e">water · soil · market</text>

    <!-- 4. Rainfall scenario -->
    <rect x="600" y="36" width="180" height="58" rx="6" fill="#161b22" stroke="#30363d" />
    <g stroke="#8b949e" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M613 66 H632 C636.4 66 638.6 62.6 637.4 59.2 C636.4 56.4 633.4 55.2 630.8 55.9 C629.6 51.1 624 48.8 620 51.4 C617.6 52.9 616.2 55.6 616.4 58.4 C613.2 58.2 611.4 60.6 612.2 63.2" />
      <path d="M618 70 L616.6 73.6" /><path d="M625 70 L623.6 73.6" /><path d="M632 70 L630.6 73.6" />
    </g>
    <text x="640" y="60" font-size="11.5" font-weight="600" fill="#e6edf3">Rainfall scenario</text>
    <text x="640" y="76" font-size="9.5" fill="#8b949e">−30% · normal · +30%</text>

    <!-- 5. Language selector -->
    <rect x="792" y="36" width="180" height="58" rx="6" fill="#161b22" stroke="#30363d" />
    <g stroke="#8b949e" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="814" cy="65" r="6.8" />
      <ellipse cx="814" cy="65" rx="3" ry="6.8" />
      <path d="M807.2 65 H820.8" />
      <path d="M808.4 61.2 H819.6" /><path d="M808.4 68.8 H819.6" />
    </g>
    <text x="832" y="60" font-size="11.5" font-weight="600" fill="#e6edf3">Language selector</text>
    <text x="832" y="76" font-size="9.5" fill="#8b949e">English · Twi · Dagbani</text>
  </g>

  <!-- ============ Endpoint links ============ -->
  <g stroke="#6e7681" stroke-width="1.4" marker-end="url(#arrow-gray)">
    <path d="M114 116 V132" />
    <path d="M354 116 V132" />
    <path d="M594 116 V132" />
    <path d="M834 116 V132" />
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#8b949e" text-anchor="middle">
    <text x="114" y="110">/recommend</text>
    <text x="354" y="110">/onset</text>
    <text x="594" y="110">/ndvi-history</text>
    <text x="834" y="110">/geocode</text>
  </g>

  <!-- ============ Backend ============ -->
  <rect x="24" y="140" width="952" height="300" rx="8" fill="#161b22" stroke="#30363d" />
  <text x="44" y="166" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#e6edf3">
    FastAPI (backend/app)
  </text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">
    <text x="48" y="196" fill="#e6edf3">nasa_power.py</text>
    <text x="48" y="230" fill="#e6edf3">onset.py</text>
    <text x="48" y="264" fill="#e6edf3">ndvi_data.py</text>
    <text x="48" y="298" fill="#e6edf3">scoring.py</text>
    <text x="48" y="332" fill="#e6edf3">gemini_client.py</text>
    <text x="48" y="366" fill="#E6912A">khaya_client.py</text>
    <g fill="#6e7681">
      <text x="186" y="196">──►</text>
      <text x="186" y="230">──►</text>
      <text x="186" y="264">──►</text>
      <text x="186" y="298">──►</text>
      <text x="186" y="332">──►</text>
      <text x="186" y="366">──►</text>
    </g>
  </g>

  <g font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#8b949e">
    <text x="248" y="196">monthly PRECTOTCORR + T2M (cached)</text>
    <text x="248" y="230">daily PRECTOTCORR 2001-2024 · 10-day sum &gt; 20 mm after 1 Mar</text>
    <text x="248" y="264">MODIS Terra 16-day NDVI composites</text>
    <text x="248" y="298">water · soil · suitability · market · risk</text>
    <text x="248" y="332">narration of already-computed scores only</text>
    <text x="248" y="366" fill="#c9a227">narration → Twi · Ewe · Ga · Dagbani · Gurene · Kusaal</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#6e7681" text-anchor="end">
    <text x="944" y="196">NASA POWER</text>
    <text x="944" y="230">NASA POWER</text>
    <text x="944" y="264">NASA GIBS</text>
    <text x="944" y="298">deterministic</text>
    <text x="944" y="332">Gemini 3.5 Flash</text>
    <text x="944" y="366" fill="#8a6a1f">Khaya AI</text>
  </g>

  <!-- ============ Amber translation/narration flow ============ -->
  <g fill="none" stroke="#E6912A" stroke-width="1.8">
    <path d="M486 340 C486 404, 200 418, 170 468 L170 486" marker-end="url(#arrow-amber)" />
    <path d="M566 374 C566 434, 300 436, 296 468 L296 486" marker-end="url(#arrow-amber)" />
  </g>
  <g fill="#E6912A">
    <circle cx="486" cy="340" r="2.6" />
    <circle cx="566" cy="374" r="2.6" />
  </g>

  <!-- ============ Outputs ============ -->
  <g font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
    <!-- Ranked cards -->
    <rect x="24" y="498" width="300" height="70" rx="6" fill="#161b22" stroke="#30363d" />
    <g stroke="#8b949e" stroke-width="1.6" fill="none" stroke-linejoin="round">
      <rect x="41" y="524" width="11" height="14" rx="2" />
      <rect x="46" y="519" width="11" height="14" rx="2" fill="#161b22" />
      <path d="M50 528 H57" stroke-linecap="round" />
      <path d="M50 532 H57" stroke-linecap="round" />
    </g>
    <text x="70" y="528" font-size="12" font-weight="600" fill="#e6edf3">Ranked rotation cards</text>
    <text x="70" y="546" font-size="10" fill="#8b949e">baseline card always first</text>

    <!-- Onset banner -->
    <rect x="348" y="498" width="300" height="70" rx="6" fill="#161b22" stroke="#30363d" />
    <g stroke="#8b949e" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M365 541 L372 534 L378 537 L385 524" />
      <circle cx="365" cy="541" r="1.8" fill="#8b949e" />
      <circle cx="385" cy="524" r="1.8" fill="#8b949e" />
    </g>
    <text x="394" y="528" font-size="12" font-weight="600" fill="#e6edf3">Onset banner</text>
    <text x="394" y="546" font-size="10" fill="#8b949e">24-year trend, days earlier</text>

    <!-- NDVI bar chart -->
    <rect x="672" y="498" width="304" height="70" rx="6" fill="#161b22" stroke="#30363d" />
    <g>
      <rect x="688" y="533" width="5" height="9" fill="#2D9E2D" />
      <rect x="696" y="527" width="5" height="15" fill="#2D9E2D" />
      <rect x="704" y="536" width="5" height="6" fill="#E6912A" />
      <rect x="712" y="522" width="5" height="20" fill="#2D9E2D" />
      <path d="M686 544 H719" stroke="#6e7681" stroke-width="1.2" />
    </g>
    <text x="718" y="528" font-size="12" font-weight="600" fill="#e6edf3">NDVI bar chart</text>
    <text x="718" y="546" font-size="10" fill="#8b949e">composites vs 0.3 stress</text>
  </g>

  <text x="500" y="600" text-anchor="middle" font-family="ui-sans-serif, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" fill="#6e7681">
    Scores are deterministic · Gemini and Khaya only rephrase them · alternatives need +0.2 to rank above the baseline
  </text>
</svg>
